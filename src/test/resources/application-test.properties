# Used by the *IT integration tests (mvnw verify). Needs the Task 1 PostgreSQL test database (never the main one).
spring.datasource.url=${LEDGER_TEST_DB_URL:jdbc:postgresql://localhost:5432/financial_ledger_task1_test_db}
spring.datasource.username=${LEDGER_TEST_DB_USERNAME:postgres}
spring.datasource.password=${LEDGER_TEST_DB_PASSWORD:}
# Fresh schema for every test run.
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only values, not real secrets.
app.jwt.secret=TEST_ONLY_JWT_SECRET_FOR_AUTOMATED_TESTS_ONLY
app.jwt.expiration-ms=600000
app.admin.email=admin@test.local
app.admin.password=test-only-admin-password

# Fixed fraud limits so the tests are predictable.
app.fraud.max-transfer-amount=50000.00
app.fraud.velocity-window-minutes=10
app.fraud.max-transactions-in-window=15

# The scheduler is disabled in tests; InterestIT calls the job directly.
app.interest.cron=-
