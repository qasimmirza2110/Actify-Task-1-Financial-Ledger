spring.application.name=task-1-financial-ledger
server.port=8080

# ---------- PostgreSQL ----------
# Secrets come from environment variables, never from this file.
# LEDGER_ prefix so this project never picks up DB_PASSWORD / JWT_SECRET that belong to other projects.
spring.datasource.url=${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/financial_ledger_task1_db}
spring.datasource.username=${LEDGER_DB_USERNAME:postgres}
# If LEDGER_DB_PASSWORD is not set, the PostgreSQL driver falls back to the user's pgpass.conf file.
spring.datasource.password=${LEDGER_DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Store and read all timestamps in UTC so the server timezone does not change the data.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT ----------
# LEDGER_JWT_SECRET must be at least 32 characters (256 bits) for HS256.
app.jwt.secret=${LEDGER_JWT_SECRET}
app.jwt.expiration-ms=${LEDGER_JWT_EXPIRATION:3600000}

# ---------- Optional admin user created on startup ----------
# Leave empty to skip. The admin can view audit logs, reverse transactions and run the interest job.
app.admin.email=${LEDGER_ADMIN_EMAIL:}
app.admin.password=${LEDGER_ADMIN_PASSWORD:}

# ---------- Fraud rules (sample values, not given by the task) ----------
app.fraud.max-transfer-amount=${LEDGER_FRAUD_MAX_TRANSFER:100000.00}
app.fraud.velocity-window-minutes=${LEDGER_FRAUD_WINDOW_MINUTES:10}
app.fraud.max-transactions-in-window=${LEDGER_FRAUD_MAX_TRANSACTIONS:5}

# ---------- Monthly interest ----------
# Default: 01:00 on the 1st day of every month. Use "-" to disable the scheduler.
app.interest.cron=${LEDGER_INTEREST_CRON:0 0 1 1 * *}
app.interest.zone=${LEDGER_INTEREST_ZONE:UTC}
